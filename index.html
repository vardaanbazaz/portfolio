<!doctype html>
<html lang="en" class="booting">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Computer vision · full-stack web · C/DSP systems" />
  <link rel="icon" href="data:," />
  <title>Vardaan</title>
  <!-- The loading screen's styles live here, not in src/index.css, so it shows the moment the document arrives.
         Grey-box: colours match --bg, --text and --line in src/index.css. src/ui/loadingScreen.ts fills and lifts it. -->
  <style>
    html.booting {
      overflow: hidden;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0d0d0f;
      color: #e8e8ea;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* Fading out: already unlocked, so presses go through to the site. */
    .loading-screen-out {
      pointer-events: none;
    }

    /* The landing name's colour, --landing-text in src/index.css. */
    .loading-screen-name {
      margin: 0;
      color: #cecaaf;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .loading-screen-bar {
      width: min(240px, 60vw);
      height: 2px;
      background: #3a3a3f;
      overflow: hidden;
    }

    .loading-screen-fill {
      height: 100%;
      background: #e8e8ea;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease-out;
    }

    .loading-screen-status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .loading-screen-slot {
      position: relative;
    }

    /* The entry gate (built by src/ui/loadingScreen.ts, its sizes from src/scene/tuning.ts as the --gate-* custom
       properties): it hangs from the bar's slot, so the screen's layout doesn't change. Text in Sulphur Yellow, the
       landing's --landing-text, with thin borders and no fill. */
    .loading-screen-gated .loading-screen-bar {
      visibility: hidden;
    }

    .loading-gate {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(var(--gate-enter-width), calc(100vw - 2 * var(--gate-side-gutter)));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gate-gap);
    }

    .loading-gate button {
      margin: 0;
      min-width: var(--gate-target);
      min-height: var(--gate-target);
      color: #cecaaf;
      background: transparent;
      border: var(--gate-border) solid transparent;
      border-radius: var(--gate-radius);
      font-family: inherit;
      cursor: pointer;
    }

    .loading-gate button:focus-visible {
      outline: var(--gate-focus-ring) solid #cecaaf;
      outline-offset: var(--gate-focus-ring-offset);
    }

    .loading-gate-enter {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gate-icon-gap);
      padding: var(--gate-enter-padding);
      /* Scrolling under the gate raises the opacity (--gate-energy-border); hover still wins. */
      border-color: rgb(206 202 175 / var(--gate-energy-border, 0.6));
      font-size: var(--gate-enter-font);
      font-weight: 600;
    }

    .loading-gate-enter:hover {
      border-color: #cecaaf;
    }

    .loading-gate-icon {
      flex: none;
      width: var(--gate-icon);
      height: var(--gate-icon);
    }

    .loading-gate-label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.2;
    }

    .loading-gate-subline {
      font-size: var(--gate-subline-font);
      font-weight: 400;
    }

    .loading-gate-quiet {
      padding: var(--gate-quiet-padding);
      font-size: var(--gate-quiet-font);
      text-decoration: underline;
      text-underline-offset: var(--gate-underline-offset);
      text-decoration-color: rgb(206 202 175 / 0.5);
    }

    .loading-gate-quiet:hover {
      border-color: transparent;
      text-decoration-color: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-screen-fill {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div id="loading-screen" class="loading-screen">
    <p class="loading-screen-name">Vardaan</p>
    <!-- The bar's slot. On the scene site the entry gate takes the bar's place here, out of the flow, so the name
         doesn't move when it appears. -->
    <div class="loading-screen-slot">
      <div class="loading-screen-bar" aria-hidden="true">
        <div class="loading-screen-fill"></div>
      </div>
    </div>
    <noscript>
      <p>This site needs JavaScript. Turn it on and reload.</p>
      <style>
        .loading-screen-slot,
        .loading-screen-status {
          display: none;
        }
      </style>
    </noscript>
    <p class="loading-screen-status" role="status">Loading</p>
  </div>
  <!-- Inert until the loading screen lifts: nothing behind it can be focused or clicked. -->
  <div id="root" inert></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
